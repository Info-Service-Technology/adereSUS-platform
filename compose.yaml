services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aderesus
      POSTGRES_USER: aderesus
      POSTGRES_PASSWORD: aderesus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aderesus -d aderesus"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aderesus_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aderesus_redis_data:/data

volumes:
  aderesus_postgres_data:
  aderesus_redis_data:
